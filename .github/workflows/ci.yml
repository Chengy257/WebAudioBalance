name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Core Verification Suites (R1, R2, R3)
        run: npm test

      - name: Validate Release Artifact Packaging
        run: npm run package

      - name: Validate Package Integrity
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (pkg.version !== manifest.version) {
              throw new Error('Version mismatch: pkg=' + pkg.version + ' manifest=' + manifest.version);
            }
            if (manifest.version !== '1.1.0') {
              throw new Error('Expected version 1.1.0, got ' + manifest.version);
            }
            const distZip = path.resolve('dist', 'webaudiobalance-v' + manifest.version + '.zip');
            if (!fs.existsSync(distZip)) {
              throw new Error('Release ZIP artifact not found: ' + distZip);
            }
            console.log('Package verification passed: ' + distZip + ' (' + fs.statSync(distZip).size + ' bytes)');
          "
